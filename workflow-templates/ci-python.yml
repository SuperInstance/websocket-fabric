# Python CI/CD Workflow Template
# For SuperInstance Python repositories
#
# Features:
# - Multi-version Python testing (3.9, 3.10, 3.11, 3.12)
# - Type checking with mypy
# - Linting with ruff
# - Testing with pytest
# - Code coverage reporting
#
# Required Secrets:
# - PYPI_API_TOKEN: For publishing to PyPI (optional, in publish.yml)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT_VERSION: '3.11'

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        shell: bash

      - name: Type check with mypy
        run: |
          mypy src/
        shell: bash
        continue-on-error: true

      - name: Lint with ruff
        run: |
          ruff check src/
        shell: bash
        continue-on-error: true

      - name: Format check with ruff
        run: |
          ruff format --check src/
        shell: bash
        continue-on-error: true

      - name: Run tests with pytest
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing
        shell: bash

      - name: Build package
        run: |
          pip install build
          python -m build
        shell: bash

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run bandit security linter
        run: |
          bandit -r src/
        continue-on-error: true

      - name: Check dependencies for security issues
        run: |
          safety check --full-report
        continue-on-error: true

  validate:
    name: Validate Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents

      - name: Build package
        run: |
          python -m build

      - name: Check package with twine
        run: |
          twine check dist/*

      - name: Validate wheel contents
        run: |
          check-wheel-contents dist/*

  success:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [test, coverage, security, validate]
    if: always()
    steps:
      - name: Check test matrix
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Test matrix failed"
            exit 1
          fi

      - name: Check coverage
        run: |
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "::warning::Coverage checks failed (non-blocking)"
          fi

      - name: Check validation
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "::error::Package validation failed"
            exit 1
          fi

      - name: Success
        run: echo "::notice::All CI checks passed successfully!"
